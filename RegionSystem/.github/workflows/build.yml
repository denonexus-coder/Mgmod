name: Build Region System

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Upload RegionSystem JAR
        uses: actions/upload-artifact@v4
        with:
          name: RegionSystem-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
